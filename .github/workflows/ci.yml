name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        env:
          ORBIT_LAB_URL: http://127.0.0.1:8000
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/orbit-lab-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; cat /tmp/orbit-lab-server.log' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 "$ORBIT_LAB_URL/healthz" > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          curl --fail --silent --max-time 2 "$ORBIT_LAB_URL/healthz"
          timeout 5m npm run test:browser
