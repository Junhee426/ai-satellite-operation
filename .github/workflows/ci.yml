name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test tests/state.test.cjs tests/orbit.test.cjs
      - run: node --check static/app.js && node --check static/lab-state.js && node --check static/orbit-geometry.js
